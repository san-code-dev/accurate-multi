# Jalankan: docker compose up -d --build
# restart: unless-stopped -> otomatis jalan lagi saat komputer/Docker hidup kembali,
# kecuali container dihentikan manual (docker compose stop / down).
services:
  accurate-multi-mcp:
    build: .
    image: accurate-multi-mcp:latest
    container_name: accurate-multi-mcp
    restart: unless-stopped
    # format raw: nilai dibaca apa adanya. Tanpa ini, tanda $ (mis. pada MCP_AUTH_TOKEN) dianggap variabel dan nilainya terpotong.
    env_file:
      - path: .env
        format: raw
    environment:
      HOST: 0.0.0.0
      PORT: ${PORT:-3031}
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 3032
      TENANTS_FILE: /app/data/tenants.json
      AUDIT_FILE: /app/data/audit.log
    # Tenant dan audit log disimpan di folder data/ komputer server (bisa ditulis oleh halaman admin).
    volumes:
      - ./data:/app/data
    ports:
      - "${PORT:-3031}:${PORT:-3031}"        # MCP: bisa diakses dari jaringan kantor
      - "127.0.0.1:3032:3032"                # Admin: HANYA dari komputer server ini
